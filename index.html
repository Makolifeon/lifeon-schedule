<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1677bb"><link rel="manifest" href="manifest.webmanifest"><title>Life On Schedule</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f3f7fa;color:#18354b}header{background:#1677bb;color:white;padding:18px}main{max-width:760px;margin:auto;padding:16px}section{background:white;padding:20px;border-radius:14px;margin-bottom:14px}label{display:block;margin:12px 0}input,button,textarea{font:inherit;padding:9px;border-radius:8px;border:1px solid #b8ccd9}button{background:#1677bb;color:white;cursor:pointer;border:0;margin:5px}textarea{width:95%;height:170px}.slot{display:inline-block;background:#e8f3fa;padding:6px;border-radius:8px;margin:4px}.notice{color:#855300}</style><header><h2>Life On Schedule</h2>空き日時を共有する日程調整アプリ</header><main><section><h3>Googleカレンダー連携</h3><label>OAuthクライアントID <input id="client" style="width:95%" placeholder="xxxx.apps.googleusercontent.com"></label><button id="connect">Googleに接続</button><button id="disconnect">解除</button><p id="status" class="notice">未接続。Google CloudでCalendar APIとOAuthの設定が必要です。</p><small>予定の件名・内容は取得せず、予定あり時間だけ参照します。</small></section><section><h3>空き日程の抽出</h3><label>開始日 <input type="date" id="from"></label><label>終了日 <input type="date" id="to"></label><label>所要時間 <select id="duration"><option value="30">30分</option><option value="60" selected>60分</option><option value="90">90分</option></select></label><label>受付開始 <input type="time" id="start" value="09:00"></label><label>受付終了 <input type="time" id="end" value="18:00"></label><button id="extract">空き時間を抽出</button><p id="info"></p><div id="slots"></div><h3>送信用テキスト</h3><textarea id="message"></textarea><p><button id="copy">テキストをコピー</button><button id="link">候補URLをコピー</button></p><small>共有URLは選択時点の候補です。リアルタイム予約確定や複数端末同期にはサーバーが必要です。</small></section><section><h3>非公開の予定</h3><label>日付 <input type="date" id="busyday"></label><label>開始 <input type="time" id="busystart" value="10:00"></label><label>終了 <input type="time" id="busyend" value="11:00"></label><button id="add">予定ありを追加</button><div id="busylist"></div><small>この端末のブラウザにのみ保存されます。</small></section></main><script src="https://accounts.google.com/gsi/client" async defer></script><script>
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),date=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),add=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return date(d)},min=t=>{let [h,m]=t.split(':').map(Number);return h*60+m},time=m=>pad(Math.floor(m/60))+':'+pad(m%60);let token=null,busy=JSON.parse(localStorage.getItem('lifeon_busy')||'[]'),googleBusy=[],selected=[];let today=date(new Date());$('from').value=today;$('to').value=add(today,6);$('busyday').value=today;$('client').value=localStorage.getItem('lifeon_client')||'';function showBusy(){$('busylist').innerHTML='';busy.forEach((b,i)=>{let p=document.createElement('p');p.textContent=b.day+' '+b.start+'〜'+b.end+' ';let btn=document.createElement('button');btn.textContent='削除';btn.onclick=()=>{busy.splice(i,1);localStorage.setItem('lifeon_busy',JSON.stringify(busy));showBusy()};p.append(btn);$('busylist').append(p)})}showBusy();$('add').onclick=()=>{let b={day:$('busyday').value,start:$('busystart').value,end:$('busyend').value};if(!b.day||min(b.end)<=min(b.start))return alert('日時を確認してください');busy.push(b);localStorage.setItem('lifeon_busy',JSON.stringify(busy));showBusy()};$('connect').onclick=()=>{let id=$('client').value.trim();if(!/^[\w-]+\.apps\.googleusercontent\.com$/.test(id))return alert('クライアントIDを確認してください');if(!window.google?.accounts?.oauth2)return alert('Google認証ライブラリを読み込めません');localStorage.setItem('lifeon_client',id);google.accounts.oauth2.initTokenClient({client_id:id,scope:'https://www.googleapis.com/auth/calendar.freebusy https://www.googleapis.com/auth/calendar.calendarlist.readonly',callback:r=>{if(!r.access_token)return $('status').textContent='認証失敗';token=r.access_token;$('status').textContent='接続中（読み取り専用）'}}).requestAccessToken({prompt:'consent'})};$('disconnect').onclick=()=>{if(token)google.accounts.oauth2.revoke(token,()=>{});token=null;googleBusy=[];$('status').textContent='未接続'};async function getBusy(a,b){googleBusy=[];if(!token)return;let headers={Authorization:'Bearer '+token},r=await fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader',{headers});if(!r.ok)throw Error('カレンダー一覧 '+r.status);let ids=((await r.json()).items||[]).filter(x=>x.selected!==false).map(x=>({id:x.id}));if(!ids.length)throw Error('対象カレンダーなし');r=await fetch('https://www.googleapis.com/calendar/v3/freeBusy',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({timeMin:new Date(a+'T00:00:00').toISOString(),timeMax:new Date(add(b,1)+'T00:00:00').toISOString(),items:ids})});if(!r.ok)throw Error('空き状況 '+r.status);for(let c of Object.values((await r.json()).calendars||{})){if(c.errors?.length)throw Error('一部カレンダーの取得失敗');googleBusy.push(...(c.busy||[]))}}function render(){selected=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);$('message').value='お世話になっております。\n打ち合わせの日程について、以下で調整可能です。\n\n'+selected.map(x=>'・'+x).join('\n')+'\n\nご都合のよい日時をお知らせください。\nよろしくお願いいたします。'}$('extract').onclick=async()=>{let a=$('from').value,b=$('to').value;if(!a||!b||a>b||(new Date(b)-new Date(a))/86400000>30)return alert('対象期間は30日以内にしてください');$('slots').replaceChildren();$('info').textContent='確認中…';$('message').value='';try{await getBusy(a,b)}catch(e){$('info').textContent='Googleの取得に失敗しました。候補を表示しません：'+e.message;return}let count=0;for(let d=a;d<=b;d=add(d,1)){let dow=new Date(d+'T12:00:00').getDay();if(dow===0||dow===6)continue;let base=new Date(d+'T00:00:00').getTime();let blocks=busy.filter(x=>x.day===d).map(x=>[min(x.start)-15,min(x.end)+15]);for(let x of googleBusy){let s=(new Date(x.start).getTime()-base)/60000,e=(new Date(x.end).getTime()-base)/60000;if(e>0&&s<1440)blocks.push([s-15,e+15])}let duration=Number($('duration').value);for(let t=min($('start').value);t+duration<=min($('end').value);t+=30){if(blocks.some(x=>t<x[1]&&t+duration>x[0]))continue;let label=document.createElement('label');label.className='slot';let cb=document.createElement('input');cb.type='checkbox';cb.className='pick';cb.checked=true;cb.value=d+' '+time(t)+'〜'+time(t+duration);cb.onchange=render;label.append(cb,document.createTextNode(' '+cb.value));$('slots').append(label);count++}}$('info').textContent=count+'件の候補を表示';render()};$('copy').onclick=()=>navigator.clipboard.writeText($('message').value).then(()=>alert('コピーしました'));$('link').onclick=()=>{if(!selected.length)return alert('候補を選択してください');let url=location.href.split('#')[0]+'#offer='+encodeURIComponent(JSON.stringify(selected));navigator.clipboard.writeText(url).then(()=>alert('候補URLをコピーしました'))};if(location.hash.startsWith('#offer=')){try{let items=JSON.parse(decodeURIComponent(location.hash.slice(7)));document.querySelector('main').innerHTML='<section><h3>打ち合わせ候補日時</h3><p>以下の候補からご都合のよい日時をお知らせください。</p><div id="offer"></div><p>※共有時点の候補です。予約は確定していません。</p></section>';for(let x of items){let p=document.createElement('p');p.textContent=x;$('offer').append(p)}}catch(e){}}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
